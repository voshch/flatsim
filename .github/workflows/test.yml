name: test

on:
  push:
    branches: [jazzy]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/flatsim

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pip
          rosdep update
          rosdep install --from-paths src --ignore-src -y
          pip install --break-system-packages attrs pyb2d3 pytest

      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-up-to flatsim

      - name: Run pytest
        shell: bash
        working-directory: src/flatsim/flatsim
        run: |
          source /opt/ros/jazzy/setup.bash
          source ../../../install/setup.bash
          pytest tests
